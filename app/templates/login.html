<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AssignEase</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ff9f43;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            width: 400px;
            max-width: 100%;
        }
        h1 {
            color: #fff;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        input[type="text"], input[type="password"] {
            width: 90%;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border: 2px solid #ff6b6b;
            outline: none;
            font-size: 1em;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #ff6b6b;
        }
        input[type="submit"] {
            background-color: #1dd1a1;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s;
        }
        input[type="submit"]:hover {
            background-color: #10ac84;
        }
        .fun-emoji {
            font-size: 4em;
            margin: 15px 0;
        }
        .links {
            margin-top: 20px;
            font-size: 1em;
            color: #fff;
        }
        .links a {
            color: white;
            text-decoration: underline;
        }
        .links a:hover {
            color: #ff6b6b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome Back!</h1>
        <div class="fun-emoji">🔐📖</div>
        <form method="POST" action="{{ url_for('login') }}">
            <input type="text" name="username" placeholder="Username" required><br>
            <input type="password" name="password" placeholder="Password" required><br>
            <input type="submit" value="Login">
        </form>
        <div class="links">
            Don't have an account? <a href="{{ url_for('register') }}">Sign up!</a>
        </div>
    </div>

</body>
</html>
