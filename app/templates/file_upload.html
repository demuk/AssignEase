<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment Upload | AssignEase</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        h1 {
            color: #5f27cd;
            margin-top: 20px;
            font-size: 2.5em;
        }
        #upload-form {
            background-color: #ffffff;
            padding: 30px;
            margin: 40px auto;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            width: 60%;
        }
        input[type="file"] {
            font-size: 1.2em;
            border: 2px dashed #5f27cd;
            padding: 10px;
            width: 100%;
            margin-top: 20px;
            cursor: pointer;
        }
        input[type="submit"] {
            background-color: #54a0ff;
            color: #ffffff;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s;
        }
        input[type="submit"]:hover {
            background-color: #2e86de;
        }
        .warning {
            color: #ff6b6b;
            font-weight: bold;
            margin-top: 20px;
        }
        #progress-bar {
            width: 100%;
            background-color: #ddd;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
        #progress-bar-inner {
            width: 0%;
            height: 25px;
            background-color: #00d2d3;
            border-radius: 8px;
            text-align: center;
            color: #fff;
            line-height: 25px;
        }
        .success-message {
            color: #1dd1a1;
            font-size: 1.5em;
            margin-top: 20px;
        }
        .fun-emoji {
            font-size: 5em;
            margin-top: 30px;
        }
        .rules {
            font-size: 1.2em;
            margin-top: 20px;
            color: #ff9f43;
        }
    </style>
</head>
<body>

    <h1>Upload Your Assignment!</h1>

    <div id="upload-form">
        <form method="POST" action="{{ url_for('upload_file') }}" enctype="multipart/form-data">
            <input type="file" name="file" id="file-input" accept=".docx, .accdb, .doc, .xls, .xlsx, .ppt, .pptx" required>
            <input type="submit" value="Upload">
        </form>

        <div id="file-warning" class="warning"></div>

        <div class="rules">
            <p>Accepted file types: .docx, .accdb, .doc, .xls, .xlsx, .ppt, .pptx</p>
        </div>

        <div id="progress-bar">
            <div id="progress-bar-inner">0%</div>
        </div>

        <div id="upload-status" class="success-message"></div>
        <div class="fun-emoji">📚🎉</div>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const fileWarning = document.getElementById('file-warning');
        const progressBar = document.getElementById('progress-bar');
        const progressBarInner = document.getElementById('progress-bar-inner');
        const uploadStatus = document.getElementById('upload-status');
        
        const allowedExtensions = ['docx', 'accdb', 'doc', 'xls', 'xlsx', 'ppt', 'pptx'];

        fileInput.addEventListener('change', function() {
            const fileName = fileInput.value.split('\\').pop();
            const fileExtension = fileName.split('.').pop().toLowerCase();
            
            if (!allowedExtensions.includes(fileExtension)) {
                fileWarning.textContent = `🚨 Oops! "${fileExtension}" is not allowed. Please upload one of the accepted formats.`;
                progressBar.style.display = 'none';
                uploadStatus.textContent = '';
                progressBarInner.style.width = '0%';
            } else {
                fileWarning.textContent = '';
            }
        });

        const form = document.querySelector('form');
        form.addEventListener('submit', function(event) {
            event.preventDefault();

            const file = fileInput.files[0];
            if (!file) {
                fileWarning.textContent = "🚨 Please select a file!";
                return;
            }

            // Simulating upload progress for demo purposes
            let progress = 0;
            progressBar.style.display = 'block';

            const interval = setInterval(() => {
                progress += 10;
                progressBarInner.style.width = progress + '%';
                progressBarInner.textContent = progress + '%';

                if (progress >= 100) {
                    clearInterval(interval);
                    uploadStatus.textContent = '🎉 File uploaded successfully!';
                    progressBarInner.textContent = 'Done!';
                }
            }, 300);
        });
    </script>
</body>
</html>
